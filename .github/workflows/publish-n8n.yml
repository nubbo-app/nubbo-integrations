name: Publish n8n node

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type the version in n8n/package.json to publish it to npm'
        required: true

permissions:
  contents: read
  id-token: write

concurrency:
  group: publish-n8n
  cancel-in-progress: false

jobs:
  publish:
    name: Publish n8n-nodes-nubbo to npm
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    defaults:
      run:
        working-directory: n8n
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 'lts/*'
          registry-url: 'https://registry.npmjs.org'
          cache: npm
          cache-dependency-path: n8n/package-lock.json

      - name: Check the version
        env:
          CONFIRM: ${{ inputs.confirm }}
        run: |
          VERSION=$(node -p "require('./package.json').version")
          if [ "$CONFIRM" != "$VERSION" ]; then
            echo "The input ($CONFIRM) does not match package.json ($VERSION)"
            exit 1
          fi

      - run: npm ci

      - run: npm run lint

      - run: npm run build

      - name: Publish with provenance
        run: npm publish --provenance --access public
        env:
          RELEASE_MODE: 'true'
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
